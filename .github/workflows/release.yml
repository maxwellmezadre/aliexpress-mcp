name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the Release and attach the binaries
  id-token: write # npm provenance (trusted publishing)

jobs:
  verify:
    name: Type-check, test & invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run verify

  npm:
    name: Publish to npm
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v6
        with:
          # Trusted publishing (OIDC) needs npm >= 11.5.1; Node 24 ships it.
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - run: bun install --frozen-lockfile
      - run: bun run build:dist
      # The first version of a new package cannot go out through OIDC: npm
      # requires the package to exist before a trusted publisher can be
      # configured, and requires the trusted publisher to publish
      # (npm/cli#8544). That version is published by hand, and this step then
      # skips the matching tag instead of failing.
      - id: published
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "$NAME@$VERSION já está no npm; nada a publicar."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      # No NODE_AUTH_TOKEN: the credential is a short-lived OIDC token minted
      # at publish time, and provenance comes for free.
      - if: steps.published.outputs.skip == 'false'
        run: npm publish --access public

  binaries:
    name: Build ${{ matrix.asset }}
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: bun-linux-x64
            asset: aliexpress-linux-x64
          - os: macos-latest
            target: bun-darwin-arm64
            asset: aliexpress-darwin-arm64
          - os: windows-latest
            target: bun-windows-x64
            asset: aliexpress-windows-x64.exe
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      # chromium-bidi stays external: it is a dynamic require inside
      # playwright-core that the compiler cannot resolve, and the code path
      # that uses it (the BiDi transport) is not ours. Chrome speaks CDP.
      - run: bun build --compile --target=${{ matrix.target }} --external chromium-bidi src/bin.ts --outfile ${{ matrix.asset }}
      - uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset }}
