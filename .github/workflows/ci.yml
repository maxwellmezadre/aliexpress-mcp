name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: Type-check & test (Bun)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bunx tsc --noEmit
      # Unit tests run against anonymized fixtures committed in test/fixtures.
      # Tests that need a real session or raw captures skip themselves.
      - run: bun test

  binary:
    name: Build binary
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run build:dist
      - run: bun run build:binary
      - run: ./aliexpress --version
