name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: Type-check, test & invariants (Bun)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      # verify.ts = tsc --noEmit + bun test + the real MCP server over stdio.
      # No network: there is no session, so no request is attempted, and the
      # live test skips itself.
      - run: bun run verify

  binary:
    name: Build binary
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run build:dist
      - run: bun run build:binary
      - run: ./aliexpress --version
